on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true

      - name: Install deps
        run: pnpm i

      - name: Compile
        run: pnpm -r build

      - name: esbuild chl-hm-ideograph
        run: |
          cd chl-hm-ideograph
          pnpm exec tsdown
          node esbuild.js

      - name: Upload bundled JS
        uses: actions/upload-artifact@v7
        with:
          name: hm-ideograph-bundled
          path: chl-hm-ideograph/dist

      - name: "Let's Hint!"
        run: |
          echo "--- UPRIGHT ---"
          node ./chl hint -c hcfg/Regular.json -h cache.gz -j 4 sources/shs/SourceHanSansTW-Regular.ttf hint-data.gz
          node ./chl instruct -c hcfg/Regular.json sources/shs/SourceHanSansTW-Regular.ttf hint-data.gz shstw-hinted.ttf
          # echo "--- ROTATED ---"
          # node ./chl hint -c hcfg/Regular.json -h cache-r.gz -j 4 shstw-rotated.ttf hint-data-r.gz
          # node ./chl instruct -c hcfg/Regular.json shstw-rotated.ttf hint-data-r.gz shstw-hinted-r.ttf

      - name: Upload hint data
        uses: actions/upload-artifact@v7
        with:
          name: hint-data
          path: |
            cache.gz
            # cache-r.gz
            hint-data.gz
            # hint-data-r.gz

      - name: Upload font
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: shstw-hinted.ttf
